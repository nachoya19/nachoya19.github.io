<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENTINEL ARCADE — Select Level (Mapa de Niveles)</title>
  <meta name="description" content="Selector de niveles interactivo en pixel art dentro de la máquina recreativa Sentinel." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 29,7 29,17 16,30 3,17 3,7' fill='%230b101d' stroke='%2300f0ff' stroke-width='2.5'/><circle cx='16' cy='15' r='4.5' fill='%2300ff66'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    @layer reset, tokens, layout, screen-ui, hotspots;

    @media (prefers-reduced-motion: no-preference) {
      @view-transition {
        navigation: auto;
      }
    }

    @layer tokens {
      :root {
        --bg-void: #1b0642;
        --pixel-font: 'Press Start 2P', monospace;
        --mono-font: 'Share Tech Mono', monospace;
        --gold: #ffd93d;
        --cyan: #00f0ff;
        --green: #38e54d;
        --red: #ff3355;
        --panel-bg: rgba(14, 18, 38, 0.92);
      }
    }

    @layer reset {
      body, h1, h2, h3, p, ul, li {
        margin: 0;
        padding: 0;
      }
      button, a {
        font: inherit;
        color: inherit;
      }
    }

    @layer layout {
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 50% 45%, #4a0e78 0%, #24064d 60%, #120229 100%);
        font-family: var(--pixel-font);
        color: #ffffff;
        user-select: none;
        -webkit-font-smoothing: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      body *, body *::before, body *::after {
        box-sizing: border-box;
      }

      :where(a, button):focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }

      /* ====================================================================
         CONTENEDOR CON LA PROPORCIÓN EXACTA (2752 x 1536) DE LA ARCADE
         Conserva intacto el mueble, joysticks, botones, luces y marquesina
         ==================================================================== */
      .arcade-scene-container {
        position: relative;
        width: min(100vw, calc(100dvh * (2752 / 1536)));
        height: min(100dvh, calc(100vw * (1536 / 2752)));
        aspect-ratio: 2752 / 1536;
        overflow: hidden;
        box-shadow: 0 0 90px rgba(0, 0, 0, 0.95);
        transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.6s ease;
      }

      /* Zoom inmersivo hacia la pantalla al entrar en un nivel */
      .arcade-scene-container.is-entering-level {
        transform: scale(1.95) translateY(5%);
        filter: brightness(1.25);
      }

      /* Capa Superior: Imagen Original de la Máquina Recreativa con Pantalla Transparente */
      .arcade-cabinet-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        image-rendering: pixelated;
        pointer-events: none;
        z-index: 25;
      }

      /* ====================================================================
         ESPACIO EXACTO DE LA PANTALLA (DONDE ESTABA EL CROMA VERDE)
         X: 26.85% a 73.15% | Y: 18.50% a 70.55%
         ==================================================================== */
      .crt-screen-hole {
        position: absolute;
        left: 26.85%;
        top: 18.50%;
        width: 46.30%;
        height: 52.05%;
        z-index: 10;
        background: #1a4b8c;
        overflow: hidden;
        border-radius: 14px;
        box-shadow: inset 0 0 36px rgba(0, 0, 0, 0.85);
      }

      /* Lienzo Pixel-Art 2D del Mapa de Niveles */
      .overworld-map-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        z-index: 1;
      }

      /* Efecto sutil de Scanlines CRT, Curvatura de Cristal y Viñeta Interior */
      .crt-glass-fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 18;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.16) 0px,
            rgba(0, 0, 0, 0.16) 1px,
            transparent 1px,
            transparent 3px
          ),
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.09) 0%,
            rgba(255, 255, 255, 0.02) 26%,
            transparent 45%,
            rgba(0, 0, 0, 0.25) 100%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            transparent 62%,
            rgba(4, 8, 22, 0.65) 100%
          );
        box-shadow:
          inset 0 6px 18px rgba(0, 0, 0, 0.75),
          inset 0 -6px 18px rgba(0, 0, 0, 0.75),
          inset 6px 0 18px rgba(0, 0, 0, 0.65),
          inset -6px 0 18px rgba(0, 0, 0, 0.65);
        transition: opacity 0.25s ease;
      }

      .crt-screen-hole.scanlines-off .crt-glass-fx {
        opacity: 0.25;
      }
    }

    @layer screen-ui {
      /* ====================================================================
         UI INTERNA DE LA PANTALLA ARCADE (CORAZONES, SELECT LEVEL, SCORE, MENÚ)
         ==================================================================== */
      .screen-ui-layer {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 3.2% 5.2% 3.8%;
        pointer-events: none;
      }

      /* Barra Superior del Juego dentro de la Pantalla */
      .screen-hud-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.4rem;
        width: 100%;
        pointer-events: auto;
      }

      /* Esquina Izquierda: Corazones de Vida + Monedas */
      .hud-corner-left {
        display: flex;
        flex-direction: column;
        gap: 0.28rem;
        background: rgba(10, 14, 30, 0.82);
        border: 2px solid #f8fafc;
        box-shadow: 0 3px 0 #000000;
        padding: 0.32rem 0.5rem;
        border-radius: 4px;
      }

      .hud-hearts-row {
        display: flex;
        align-items: center;
        gap: 0.22rem;
        font-size: clamp(0.55rem, 0.95vw, 0.82rem);
        color: var(--red);
        text-shadow: 1px 1px 0 #000;
        line-height: 1;
      }

      .hud-heart {
        display: inline-block;
        animation: heart-beat 1.6s infinite ease-in-out;
      }
      .hud-heart:nth-child(2) { animation-delay: 0.2s; }
      .hud-heart:nth-child(3) { animation-delay: 0.4s; }

      @keyframes heart-beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.16); }
      }

      .hud-coins-row {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: clamp(0.42rem, 0.68vw, 0.58rem);
        color: var(--gold);
        text-shadow: 1px 1px 0 #000;
      }

      .coin-pixel-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--gold);
        border: 1.5px solid #b45309;
        box-shadow: 0 0 4px var(--gold);
      }

      /* Cartel Central: SELECT LEVEL */
      .hud-title-banner {
        background: linear-gradient(180deg, #2b1644 0%, #140826 100%);
        border: 2.5px solid var(--gold);
        box-shadow:
          0 4px 0 #000000,
          inset 0 0 12px rgba(255, 217, 61, 0.35);
        padding: 0.36rem 0.85rem;
        border-radius: 5px;
        text-align: center;
        transform: translateY(-1px);
      }

      .hud-select-title {
        font-size: clamp(0.62rem, 1.15vw, 1.02rem);
        color: var(--gold);
        letter-spacing: 2px;
        text-shadow:
          2px 2px 0 #000000,
          0 0 10px rgba(255, 217, 61, 0.65);
        line-height: 1.15;
      }

      .hud-select-sub {
        font-family: var(--mono-font);
        font-size: clamp(0.48rem, 0.72vw, 0.65rem);
        color: #e2e8f0;
        letter-spacing: 1.5px;
        margin-top: 2px;
      }

      /* Esquina Derecha: Score + Botón de Menú */
      .hud-corner-right {
        display: flex;
        align-items: stretch;
        gap: 0.35rem;
      }

      .hud-score-box {
        background: rgba(10, 14, 30, 0.82);
        border: 2px solid #f8fafc;
        box-shadow: 0 3px 0 #000000;
        padding: 0.32rem 0.55rem;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.22rem;
        text-align: right;
      }

      .hud-score-label {
        font-size: clamp(0.38rem, 0.58vw, 0.48rem);
        color: var(--cyan);
      }

      .hud-score-val {
        font-size: clamp(0.46rem, 0.72vw, 0.62rem);
        color: #ffffff;
        text-shadow: 1px 1px 0 #000;
      }

      .btn-pixel-menu {
        background: #2563eb;
        border: 2px solid #ffffff;
        box-shadow: 0 3px 0 #000000;
        color: #ffffff;
        border-radius: 4px;
        padding: 0.3rem 0.5rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: clamp(0.42rem, 0.64vw, 0.54rem);
        transition: transform 0.1s ease, background-color 0.15s ease;
      }

      .btn-pixel-menu:hover:not(:disabled) {
        background: #3b82f6;
      }

      .btn-pixel-menu:active:not(:disabled) {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #000000;
      }

      /* ====================================================================
         NODOS INTERACTIVOS DE LOS 4 NIVELES SOBRE EL MAPA 2D
         ==================================================================== */
      .map-nodes-layer {
        position: absolute;
        inset: 0;
        z-index: 14;
        pointer-events: none;
      }

      .map-level-node {
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .map-level-node:hover,
      .map-level-node[data-active="true"] {
        transform: translate(-50%, -56%) scale(1.08);
        z-index: 20;
      }

      /* Placa de texto pixelada 'LVL 01', 'LVL 02', etc. */
      .node-label-plate {
        background: rgba(11, 15, 32, 0.94);
        border: 2px solid #ffffff;
        box-shadow: 0 3px 0 #000000, 0 0 12px rgba(0, 0, 0, 0.85);
        padding: 0.26rem 0.48rem;
        border-radius: 4px;
        text-align: center;
        white-space: nowrap;
        transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      }

      .map-level-node[data-active="true"] .node-label-plate,
      .map-level-node:hover .node-label-plate {
        background: #1e1038;
        border-color: var(--gold);
        box-shadow: 0 3px 0 #000000, 0 0 16px rgba(255, 217, 61, 0.75);
      }

      .node-lvl-code {
        display: block;
        font-size: clamp(0.46rem, 0.76vw, 0.66rem);
        color: var(--gold);
        text-shadow: 1px 1px 0 #000;
        margin-bottom: 2px;
      }

      .node-lvl-name {
        display: block;
        font-family: var(--mono-font);
        font-weight: 700;
        font-size: clamp(0.48rem, 0.75vw, 0.66rem);
        color: #ffffff;
        letter-spacing: 0.5px;
      }

      /* Estilos para niveles bloqueados (LVL 03 y LVL 04) */
      .map-level-node.is-locked .node-label-plate {
        background: rgba(15, 23, 42, 0.94);
        border: 2px dashed #64748b;
        box-shadow: 0 3px 0 #000000;
        opacity: 0.85;
      }

      .map-level-node.is-locked .node-lvl-code {
        color: #94a3b8;
      }

      .map-level-node.is-locked .node-lvl-name {
        color: #ef4444;
      }

      .map-level-node.is-locked .node-pedestal-ring {
        background: radial-gradient(circle, #64748b 0%, #334155 70%, #0f172a 100%);
        border-color: #94a3b8;
      }

      .map-level-node.is-locked:hover .node-label-plate,
      .map-level-node.is-locked[data-active="true"] .node-label-plate {
        background: #1c1326;
        border-color: #ef4444;
        box-shadow: 0 3px 0 #000000, 0 0 16px rgba(239, 68, 68, 0.7);
        opacity: 1;
      }

      .map-level-node.is-locked:hover .node-lvl-code,
      .map-level-node.is-locked[data-active="true"] .node-lvl-code {
        color: #fca5a5;
      }

      .map-level-node.is-locked:hover .node-lvl-name,
      .map-level-node.is-locked[data-active="true"] .node-lvl-name {
        color: #ffffff;
      }

      .map-level-node.is-locked:hover .node-pedestal-ring,
      .map-level-node.is-locked[data-active="true"] .node-pedestal-ring {
        background: radial-gradient(circle, #ef4444 0%, #991b1b 70%, #450a0a 100%);
        border-color: #fca5a5;
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.8), 0 2px 0 #000;
      }

      /* Pedestal circular del nodo sobre el camino */
      .node-pedestal-ring {
        width: clamp(18px, 2.2vw, 28px);
        height: clamp(10px, 1.2vw, 15px);
        border-radius: 50%;
        background: radial-gradient(circle, #ffd93d 0%, #d97706 70%, #78350f 100%);
        border: 2px solid #ffffff;
        box-shadow: 0 2px 0 #000000;
        margin-bottom: 4px;
      }

      .map-level-node[data-active="true"] .node-pedestal-ring {
        background: radial-gradient(circle, #00ff66 0%, #059669 70%, #064e3b 100%);
        box-shadow: 0 0 12px #00ff66, 0 2px 0 #000;
      }

      /* Flecha pixelada saltarina sobre el nivel seleccionado */
      .node-cursor-arrow {
        font-size: clamp(0.6rem, 1vw, 0.85rem);
        color: var(--gold);
        text-shadow: 0 2px 0 #000, 0 0 8px var(--gold);
        margin-bottom: 2px;
        opacity: 0;
        animation: arrow-bounce 0.65s infinite alternate ease-in-out;
      }

      .map-level-node[data-active="true"] .node-cursor-arrow {
        opacity: 1;
      }

      @keyframes arrow-bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(-5px); }
      }

      /* ====================================================================
         BARRA INFERIOR DE PREVIEW DE CARÁTULA Y ACCIÓN DENTRO DE LA PANTALLA
         ==================================================================== */
      .screen-hud-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        background: rgba(10, 14, 29, 0.92);
        border: 2px solid #f8fafc;
        box-shadow: 0 4px 0 #000000;
        border-radius: 6px;
        padding: 0.35rem 0.55rem;
        pointer-events: auto;
      }

      .preview-thumb-wrap {
        width: clamp(54px, 7.2vw, 96px);
        aspect-ratio: 16 / 9;
        border-radius: 3px;
        overflow: hidden;
        border: 1.5px solid var(--gold);
        background: #000;
        flex-shrink: 0;
      }

      .preview-thumb-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .preview-meta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .preview-stage-Title {
        font-size: clamp(0.46rem, 0.76vw, 0.66rem);
        color: var(--gold);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 1px 1px 0 #000;
      }

      .preview-stage-desc {
        font-family: var(--mono-font);
        font-size: clamp(0.48rem, 0.75vw, 0.66rem);
        color: #cbd5e1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview-thumb-wrap.is-locked {
        border-color: #ef4444;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.45);
      }

      .preview-thumb-wrap.is-locked .preview-thumb-img {
        filter: grayscale(80%) brightness(0.5);
      }

      .btn-enter-stage {
        background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
        border: 2px solid #ffffff;
        box-shadow: 0 3px 0 #052e16;
        color: #ffffff;
        font-size: clamp(0.44rem, 0.72vw, 0.62rem);
        padding: 0.42rem 0.68rem;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        text-shadow: 1px 1px 0 #000;
        animation: pulse-play-btn 1.3s infinite alternate;
      }

      .btn-enter-stage:hover {
        background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
        color: #000;
        text-shadow: none;
      }

      .btn-enter-stage.is-locked {
        background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
        border: 2px solid #64748b;
        box-shadow: 0 3px 0 #0f172a;
        color: #94a3b8;
        cursor: not-allowed;
        animation: none;
      }

      .btn-enter-stage.is-locked:hover {
        background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
        border-color: #fca5a5;
        color: #ffffff;
        box-shadow: 0 3px 0 #450a0a, 0 0 14px rgba(239, 68, 68, 0.75);
      }

      /* Animación de vibración / error en niveles bloqueados */
      .is-shaking {
        animation: locked-shake 0.32s ease-out !important;
      }

      @keyframes locked-shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      @keyframes pulse-play-btn {
        0% { box-shadow: 0 3px 0 #052e16, 0 0 6px rgba(34, 197, 94, 0.4); }
        100% { box-shadow: 0 3px 0 #052e16, 0 0 16px rgba(74, 222, 128, 0.9); }
      }

      /* Menú Desplegable Pixel Art dentro de la pantalla */
      .pixel-menu-popover {
        position: absolute;
        top: 14%;
        right: 3.2%;
        z-index: 30;
        background: rgba(12, 17, 36, 0.96);
        border: 2px solid var(--gold);
        box-shadow: 0 6px 0 #000, 0 0 20px rgba(0, 0, 0, 0.9);
        border-radius: 6px;
        padding: 0.55rem;
        display: flex;
        flex-direction: column;
        gap: 0.38rem;
        pointer-events: auto;
        min-width: 170px;
      }

      .pixel-menu-popover[hidden] {
        display: none !important;
      }

      .menu-item-btn {
        background: #1e293b;
        border: 1.5px solid #475569;
        color: #f8fafc;
        font-family: var(--mono-font);
        font-size: 0.72rem;
        padding: 0.35rem 0.55rem;
        border-radius: 4px;
        cursor: pointer;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .menu-item-btn:hover:not(:disabled) {
        border-color: var(--cyan);
        color: var(--cyan);
        background: #0f172a;
      }
    }

    @layer hotspots {
      /* ====================================================================
         ZONAS INTERACTIVAS SOBRE LOS MANDOS DE LA MÁQUINA RECREATIVA
         Permiten usar el joystick y los botones del mueble arcade haciendo clic
         ==================================================================== */
      .cabinet-hotspot {
        position: absolute;
        z-index: 28;
        background: transparent;
        border: none;
        cursor: pointer;
        border-radius: 50%;
      }

      .cabinet-hotspot:focus-visible {
        outline: 2px dashed var(--gold);
      }

      /* Joystick Izquierdo de la recreativa */
      .hotspot-joy-left {
        left: 26.2%;
        top: 71.2%;
        width: 5.5%;
        height: 11.5%;
      }

      /* Botonera Izquierda (6 botones de colores) */
      .hotspot-btns-left {
        left: 33.4%;
        top: 75.5%;
        width: 11.8%;
        height: 8.5%;
        border-radius: 12px;
      }

      /* Botones Centrales 1P / 2P Start */
      .hotspot-start-center {
        left: 46.5%;
        top: 74.5%;
        width: 7.8%;
        height: 5.2%;
        border-radius: 10px;
      }

      /* Joystick Derecho de la recreativa */
      .hotspot-joy-right {
        left: 56.2%;
        top: 71.2%;
        width: 5.5%;
        height: 11.5%;
      }

      /* Botonera Derecha (6 botones de colores) */
      .hotspot-btns-right {
        left: 63.4%;
        top: 75.5%;
        width: 11.8%;
        height: 8.5%;
        border-radius: 12px;
      }

      /* Ranura de Monedas Inferior (Insert Coin) */
      .hotspot-coin-door {
        left: 45.2%;
        top: 90.0%;
        width: 9.6%;
        height: 9.5%;
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>

  <main class="arcade-scene-container" id="arcade-scene">

    <!-- ====================================================================
         INTERIOR DE LA PANTALLA ARCADE (REEMPLAZA EL CROMA VERDE)
         ==================================================================== -->
    <section class="crt-screen-hole" id="crt-screen" aria-label="Mapa interactivo de selección de niveles">

      <!-- Lienzo 2D Pixel Art (Agua, Nubes, Islas, Biomas, Camino y Personaje) -->
      <canvas
        id="overworld-canvas"
        class="overworld-map-canvas"
        width="640"
        height="400"
        aria-hidden="true"
      ></canvas>

      <!-- Nodos Interactivos de los 4 Niveles sobre el Mapa -->
      <nav class="map-nodes-layer" aria-label="Niveles del sitio web">

        <!-- LVL 01: Bosque / Inicio - Presentación Sprint 1 -->
        <a
          href="presentacion.html"
          class="map-level-node"
          id="node-lvl-0"
          data-level="0"
          data-active="true"
          style="left: 19%; top: 63%;"
        >
          <span class="node-cursor-arrow" aria-hidden="true">▼</span>
          <span class="node-pedestal-ring" aria-hidden="true"></span>
          <span class="node-label-plate">
            <span class="node-lvl-code">LVL 01</span>
            <span class="node-lvl-name">SPRINT 1</span>
          </span>
        </a>

        <!-- LVL 02: Cueva Cristalina - Sentinel One-Page -->
        <a
          href="Sprint2/index.html"

  <script>
    (function () {
      /* ====================================================================
         1. MOTOR DE SONIDO CHIPTUNE / ARCADE (WEB AUDIO API)
         ==================================================================== */
      class RetroMapAudio {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }
        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }
        playStep(levelIdx) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          const freqs = [440, 523.25, 659.25, 783.99];
          const f = freqs[levelIdx % freqs.length];
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.exponentialRampToValueAtTime(f * 1.25, now + 0.07);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        }
        playCoin() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [
            { f: 987.77, t: 0, d: 0.07 },
            { f: 1318.51, t: 0.07, d: 0.28 }
          ];
          notes.forEach((n) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(n.f, now + n.t);
            gain.gain.setValueAtTime(0.14, now + n.t);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + n.t);
            osc.stop(now + n.t + n.d);
          });
        }
        playStartLevel() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const melody = [523.25, 659.25, 783.99, 1046.5];
          melody.forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(f, now + i * 0.055);
            gain.gain.setValueAtTime(0.15, now + i * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.13);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.055);
            osc.stop(now + i * 0.055 + 0.13);
          });
        }
        playDeny() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.setValueAtTime(90, now + 0.08);

          gain.gain.setValueAtTime(0.18, now);
          gain.gain.setValueAtTime(0.02, now + 0.07);
          gain.gain.setValueAtTime(0.18, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        }
      }

      const audio = new RetroMapAudio();

      /* ====================================================================
         2. DATOS DE LOS 4 NIVELES DEL MAPA 2D
         ==================================================================== */
      const LEVELS = [
        {
          id: 0,
          code: 'LVL 01',
          name: 'SPRINT 1',
          title: 'LVL 01 · PRESENTACIÓN SPRINT 1',
          desc: 'Bosque de Inicio · Diapositivas interactivas, equipo DISC y sprints',
          href: 'presentacion.html',
          cover: 'assets/covers/cover_sprint1.jpg',
          mapX: 122,
          mapY: 252,
          locked: false
        },
        {
          id: 1,
          code: 'LVL 02',
          name: 'ONE-PAGE',
          title: 'LVL 02 · SENTINEL ONE-PAGE (WEB 2D)',
          desc: 'Cueva Cristalina · Nivel 2D estilo Zelda, correo trampa y métricas',
          href: 'Sprint2/index.html',
          cover: 'assets/covers/cover_sprint2.jpg',
          mapX: 262,
          mapY: 152,
          locked: false
        },
        {
          id: 2,
          code: 'LVL 03',
          name: 'BLOQUEADO',
          title: '🔒 LVL 03 · [BLOQUEADO]',
          desc: 'Zona Volcánica · Nivel bloqueado. Próximamente en el siguiente Sprint',
          href: '#',
          cover: 'assets/covers/cover_sprint2.jpg',
          mapX: 403,
          mapY: 256,
          locked: true
        },
        {
          id: 3,
          code: 'LVL 04',
          name: 'BLOQUEADO',
          title: '🔒 LVL 04 · [BLOQUEADO]',
          desc: 'Castillo Final · Nivel bloqueado. Próximamente en el siguiente Sprint',
          href: '#',
          cover: 'assets/covers/cover_sprint1.jpg',
          mapX: 531,
          mapY: 140,
          locked: true

      ];

      /* Puntos del camino serpenteante entre niveles para que el personaje camine por él */
      const PATH_SEGMENTS = [
        // 0 -> 1 (Bosque a Cueva)
        [
          { x: 122, y: 252 },
          { x: 162, y: 238 },
          { x: 195, y: 205 },
          { x: 228, y: 172 },
          { x: 262, y: 152 }
        ],
        // 1 -> 2 (Cueva a Volcán/Lava)
        [
          { x: 262, y: 152 },
          { x: 300, y: 175 },
          { x: 334, y: 212 },
          { x: 368, y: 242 },
          { x: 403, y: 256 }
        ],
        // 2 -> 3 (Volcán/Lava a Castillo Final)
        [
          { x: 403, y: 256 },
          { x: 440, y: 232 },
          { x: 472, y: 198 },
          { x: 502, y: 165 },
          { x: 531, y: 140 }
        ]
      ];

      /* ====================================================================
         3. ESTADO Y ELEMENTOS DEL DOM
         ==================================================================== */
      const nodeEls = Array.from(document.querySelectorAll('.map-level-node'));
      const previewCoverImg = document.getElementById('preview-cover-img');
      const previewTitle = document.getElementById('preview-stage-title');
      const previewDesc = document.getElementById('preview-stage-desc');
      const btnEnterActive = document.getElementById('btn-enter-active');
      const hudCoinsText = document.getElementById('hud-coins-text');
      const hudScoreText = document.getElementById('hud-score-text');
      const arcadeScene = document.getElementById('arcade-scene');
      const crtScreen = document.getElementById('crt-screen');

      const btnMenuToggle = document.getElementById('btn-menu-toggle');
      const pixelMenu = document.getElementById('pixel-menu');
      const btnToggleAudio = document.getElementById('btn-toggle-audio');
      const audioStateLabel = document.getElementById('audio-state-label');
      const btnToggleScanlines = document.getElementById('btn-toggle-scanlines');
      const crtStateLabel = document.getElementById('crt-state-label');
      const btnToggleFull = document.getElementById('btn-toggle-full');

      let currentLevel = 0;
      let coins = 25;
      let score = 24850;
      let isNavigating = false;

      // Posición animada del héroe pixelado sobre el camino
      const hero = {
        x: LEVELS[0].mapX - 24,
        y: LEVELS[0].mapY - 12,
        targetX: LEVELS[0].mapX - 24,
        targetY: LEVELS[0].mapY - 12,
        waypoints: [],
        facing: 1
      };

      function buildWaypoints(fromIdx, toIdx) {
        if (fromIdx === toIdx) return [];
        const pts = [];
        if (fromIdx < toIdx) {
          for (let s = fromIdx; s < toIdx; s++) {
            PATH_SEGMENTS[s].forEach((p, idx) => {
              if (idx > 0) pts.push({ x: p.x - 22, y: p.y - 12 });
            });
          }
        } else {
          for (let s = fromIdx - 1; s >= toIdx; s--) {
            const rev = [...PATH_SEGMENTS[s]].reverse();
            rev.forEach((p, idx) => {
              if (idx > 0) pts.push({ x: p.x - 22, y: p.y - 12 });
            });
          }
        }
        return pts;
      }

      const previewThumbWrap = document.querySelector('.preview-thumb-wrap');

      function selectLevel(newIdx, playSfx = true) {
        if (isNavigating) return;
        const clamped = Math.max(0, Math.min(LEVELS.length - 1, newIdx));
        if (clamped !== currentLevel) {
          hero.facing = clamped > currentLevel ? 1 : -1;
          hero.waypoints = buildWaypoints(currentLevel, clamped);
          score += 150;
          hudScoreText.textContent = String(score).padStart(6, '0');
        }
        currentLevel = clamped;

        const lvl = LEVELS[currentLevel];
        nodeEls.forEach((el, idx) => {
          el.setAttribute('data-active', idx === currentLevel ? 'true' : 'false');
        });

        previewCoverImg.src = lvl.cover;
        previewTitle.textContent = lvl.title;
        previewDesc.textContent = lvl.desc;

        if (lvl.locked) {
          if (previewThumbWrap) previewThumbWrap.classList.add('is-locked');
          btnEnterActive.classList.add('is-locked');
          btnEnterActive.textContent = '🔒 BLOQUEADO';
          btnEnterActive.removeAttribute('href');
          btnEnterActive.setAttribute('aria-disabled', 'true');
        } else {
          if (previewThumbWrap) previewThumbWrap.classList.remove('is-locked');
          btnEnterActive.classList.remove('is-locked');
          btnEnterActive.textContent = '▶ ENTRAR';
          btnEnterActive.href = lvl.href;
          btnEnterActive.removeAttribute('aria-disabled');
        }

        if (playSfx) {
          if (lvl.locked) {
            audio.playDeny();
          } else {
            audio.playStep(currentLevel);
          }
        }
      }

      function enterLevel(idx) {
        if (isNavigating) return;
        const lvl = LEVELS[idx];
        if (lvl.locked) {
          selectLevel(idx, false);
          audio.playDeny();
          btnEnterActive.classList.remove('is-shaking');
          void btnEnterActive.offsetWidth;
          btnEnterActive.classList.add('is-shaking');
          const nodeEl = nodeEls[idx];
          if (nodeEl) {
            nodeEl.classList.remove('is-shaking');
            void nodeEl.offsetWidth;
            nodeEl.classList.add('is-shaking');
          }
          return;
        }

        selectLevel(idx, false);
        isNavigating = true;
        audio.playStartLevel();
        arcadeScene.classList.add('is-entering-level');

        const destination = lvl.href;
        setTimeout(() => {
          window.location.href = destination;
        }, 340);
      }

      // Eventos en los nodos del mapa
      nodeEls.forEach((nodeEl, idx) => {
        nodeEl.addEventListener('mouseenter', () => {
          if (currentLevel !== idx) selectLevel(idx, true);
        });
        nodeEl.addEventListener('focus', () => {
          if (currentLevel !== idx) selectLevel(idx, false);
        });
        nodeEl.addEventListener('click', (e) => {
          e.preventDefault();
          enterLevel(idx);
        });
      });

      btnEnterActive.addEventListener('click', (e) => {
        e.preventDefault();
        enterLevel(currentLevel);
      });

      // Hotspots físicos sobre el mueble de la máquina recreativa
      document.getElementById('hotspot-joy-left').addEventListener('click', () => {
        selectLevel(currentLevel > 0 ? currentLevel - 1 : LEVELS.length - 1, true);
      });
      document.getElementById('hotspot-joy-right').addEventListener('click', () => {
        selectLevel(currentLevel < LEVELS.length - 1 ? currentLevel + 1 : 0, true);
      });
      document.getElementById('hotspot-btns-right').addEventListener('click', () => {
        selectLevel(currentLevel < LEVELS.length - 1 ? currentLevel + 1 : 0, true);
      });
      document.getElementById('hotspot-btns-left').addEventListener('click', () => {
        enterLevel(currentLevel);
      });
      document.getElementById('hotspot-start-center').addEventListener('click', () => {
        enterLevel(currentLevel);
      });
      document.getElementById('hotspot-coin-door').addEventListener('click', () => {
        coins = Math.min(99, coins + 1);
        score += 500;
        hudCoinsText.textContent = `x${String(coins).padStart(2, '0')}`;
        hudScoreText.textContent = String(score).padStart(6, '0');
        audio.playCoin();
      });

      // Menú desplegable
      btnMenuToggle.addEventListener('click', () => {
        const isHidden = pixelMenu.hasAttribute('hidden');
        if (isHidden) {
          pixelMenu.removeAttribute('hidden');
          btnMenuToggle.setAttribute('aria-expanded', 'true');
        } else {
          pixelMenu.setAttribute('hidden', '');
          btnMenuToggle.setAttribute('aria-expanded', 'false');
        }
        audio.playStep(currentLevel);
      });

      btnToggleAudio.addEventListener('click', () => {
        audio.muted = !audio.muted;
        audioStateLabel.textContent = audio.muted ? 'OFF' : 'ON';
        if (!audio.muted) audio.playCoin();
      });

      btnToggleScanlines.addEventListener('click', () => {
        const isOff = crtScreen.classList.toggle('scanlines-off');
        crtStateLabel.textContent = isOff ? 'OFF' : 'ON';
        audio.playStep(currentLevel);
      });

      btnToggleFull.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
        pixelMenu.setAttribute('hidden', '');
      });

      // Controles por teclado (Flechas Izquierda/Derecha/Arriba/Abajo + Enter/Espacio)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
          e.preventDefault();
          selectLevel(currentLevel < LEVELS.length - 1 ? currentLevel + 1 : 0, true);
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
          e.preventDefault();
          selectLevel(currentLevel > 0 ? currentLevel - 1 : LEVELS.length - 1, true);
        } else if (e.key === 'Enter' || e.key === ' ') {
          const active = document.activeElement;
          const isMenuBtn = active && active.closest('#pixel-menu, #btn-menu-toggle');
          if (!isMenuBtn) {
            e.preventDefault();
            enterLevel(currentLevel);
          }
        } else if (e.key === 'Escape') {
          pixelMenu.setAttribute('hidden', '');
          btnMenuToggle.setAttribute('aria-expanded', 'false');
        }
      });

      /* ====================================================================
         4. RENDERIZADOR PIXEL-ART 16-BITS DEL MAPA DE NIVELES (CANVAS)
         Dibuja océano animado, nubes, 4 islas/biomas (Bosque, Cueva, Volcán,
         Castillo), camino de piedra/tierra, árboles, ruinas y el personaje
         ==================================================================== */
      const canvas = document.getElementById('overworld-canvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      // Cargar avatar pixel-art del protagonista si está disponible
      const heroImg = new Image();
      let heroImgLoaded = false;
      heroImg.onload = () => { heroImgLoaded = true; };
      heroImg.src = 'assets/avatars/avatar_mario.png';

      const clouds = [
        { x: 55, y: 42, w: 64, h: 18, speed: 0.14 },
        { x: 240, y: 30, w: 80, h: 20, speed: 0.10 },
        { x: 430, y: 48, w: 58, h: 16, speed: 0.18 },
        { x: 560, y: 34, w: 70, h: 18, speed: 0.12 }
      ];

      function drawPixelRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function drawCloud(cx, cy, cw, ch) {
        drawPixelRect(cx + 8, cy + 4, cw - 16, ch, '#cbd5e1');
        drawPixelRect(cx + 4, cy, cw - 8, ch - 2, '#f8fafc');
        drawPixelRect(cx + 12, cy - 6, cw - 24, 8, '#ffffff');
      }

      function drawIslandBase(cx, cy, rx, ry, topColor, edgeColor, cliffColor, shadowColor) {
        // Sombra en el agua y espuma de costa
        ctx.fillStyle = shadowColor;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 16, rx + 8, ry + 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Acantilado rocoso inferior en bloques pixelados
        for (let i = -rx + 6; i < rx - 6; i += 10) {
          const depth = Math.sin(((i + rx) / (rx * 2)) * Math.PI) * 18 + 8;
          drawPixelRect(cx + i, cy, 11, depth, cliffColor);
          drawPixelRect(cx + i + 2, cy + 2, 4, depth - 4, edgeColor);
        }

        // Superficie de la isla
        ctx.fillStyle = edgeColor;
        ctx.beginPath();
        ctx.ellipse(cx, cy + 3, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = topColor;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx - 4, ry - 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPixelTree(tx, ty, sway) {
        // Tronco
        drawPixelRect(tx - 3, ty - 8, 6, 10, '#78350f');
        // Copa de hojas en capas pixel art
        drawPixelRect(tx - 11 + sway, ty - 18, 22, 12, '#15803d');
        drawPixelRect(tx - 9 + sway, ty - 26, 18, 10, '#22c55e');
        drawPixelRect(tx - 5 + sway, ty - 31, 10, 6, '#4ade80');
      }

      function drawPixelRuins(rx, ry) {
        // Columnas antiguas de piedra en el bioma 1
        drawPixelRect(rx, ry - 18, 6, 18, '#94a3b8');
        drawPixelRect(rx - 2, ry - 20, 10, 3, '#cbd5e1');
        drawPixelRect(rx + 12, ry - 12, 6, 12, '#64748b');
        drawPixelRect(rx + 6, ry - 4, 6, 4, '#94a3b8');
      }

      function drawCaveBiome(cx, cy, tick) {
        // Montaña rocosa de la cueva (LVL 02)
        drawPixelRect(cx - 34, cy - 42, 68, 34, '#334155');
        drawPixelRect(cx - 26, cy - 54, 52, 14, '#475569');
        drawPixelRect(cx - 16, cy - 62, 32, 10, '#64748b');
        // Entrada oscura de la cueva
        drawPixelRect(cx - 14, cy - 32, 28, 24, '#090d16');
        drawPixelRect(cx - 10, cy - 36, 20, 6, '#090d16');
        // Cristales mágicos cian brillantes
        const glow = Math.sin(tick * 0.08) > 0 ? '#67e8f9' : '#00f0ff';
        drawPixelRect(cx - 28, cy - 22, 5, 12, glow);
        drawPixelRect(cx + 22, cy - 26, 6, 14, glow);
        // Antorchas encendidas a los lados
        const flameColor = (Math.floor(tick / 6) % 2 === 0) ? '#ffbe0b' : '#ff5500';
        drawPixelRect(cx - 19, cy - 24, 3, 8, '#78350f');
        drawPixelRect(cx - 20, cy - 29, 5, 5, flameColor);
        drawPixelRect(cx + 16, cy - 24, 3, 8, '#78350f');
        drawPixelRect(cx + 15, cy - 29, 5, 5, flameColor);
      }

      function drawLavaBiome(cx, cy, tick) {
        // Volcán y ríos de lava (LVL 03)
        drawPixelRect(cx - 32, cy - 38, 64, 30, '#451a03');
        drawPixelRect(cx - 22, cy - 50, 44, 14, '#7c2d12');
        drawPixelRect(cx - 14, cy - 58, 28, 10, '#9a3412');
        // Cráter de lava ardiente
        const lavaCol = (Math.floor(tick / 8) % 2 === 0) ? '#ff3300' : '#ffbe0b';
        drawPixelRect(cx - 12, cy - 60, 24, 5, lavaCol);
        // Cascada de magma
        drawPixelRect(cx - 5, cy - 55, 10, 38, '#ef4444');
        drawPixelRect(cx - 2, cy - 52 + (tick % 10), 4, 18, '#fde047');
        // Charcos de fuego
        drawPixelRect(cx - 28, cy - 12, 16, 6, '#f97316');
        drawPixelRect(cx + 14, cy - 14, 18, 6, '#ef4444');
      }

      function drawCastleBiome(cx, cy, tick) {
        // Castillo Final Sentinel (LVL 04)
        // Torres laterales
        drawPixelRect(cx - 34, cy - 56, 16, 46, '#cbd5e1');
        drawPixelRect(cx + 18, cy - 56, 16, 46, '#cbd5e1');
        // Cuerpo central del castillo
        drawPixelRect(cx - 20, cy - 48, 40, 38, '#94a3b8');
        // Torreón principal
        drawPixelRect(cx - 12, cy - 68, 24, 24, '#e2e8f0');
        // Tejados rojos/púrpura reales
        drawPixelRect(cx - 36, cy - 64, 20, 8, '#e11d48');
        drawPixelRect(cx + 16, cy - 64, 20, 8, '#e11d48');
        drawPixelRect(cx - 14, cy - 76, 28, 8, '#be123c');
        // Puerta rastrillo del castillo
        drawPixelRect(cx - 8, cy - 28, 16, 18, '#451a03');
        drawPixelRect(cx - 6, cy - 26, 12, 16, '#1e293b');
        // Bandera ondeando en la cima
        const wave = Math.floor(tick / 10) % 2 === 0 ? 0 : 2;
        drawPixelRect(cx, cy - 90, 2, 14, '#f8fafc');
        drawPixelRect(cx + 2, cy - 89 + wave, 14, 7, '#00f0ff');
      }

      function drawStoneDirtPath() {
        // Camino de tierra ocre y losas de piedra conectando LVL 01 -> LVL 02 -> LVL 03 -> LVL 04
        PATH_SEGMENTS.forEach((seg) => {
          for (let i = 0; i < seg.length - 1; i++) {
            const p1 = seg[i];
            const p2 = seg[i + 1];
            const steps = 14;
            for (let s = 0; s <= steps; s++) {
              const t = s / steps;
              const px = p1.x + (p2.x - p1.x) * t;
              const py = p1.y + (p2.y - p1.y) * t;
              // Borde oscuro del camino
              drawPixelRect(px - 9, py - 5, 18, 12, '#78350f');
              // Tierra ocre central
              drawPixelRect(px - 7, py - 4, 14, 9, '#d97706');
              // Adoquines de piedra clara salpicados
              if (s % 2 === 0) {
                drawPixelRect(px - 4, py - 2, 6, 4, '#fde68a');
              } else {
                drawPixelRect(px + 1, py, 5, 3, '#fcd34d');
              }
            }
          }
        });
      }

      function drawHeroCharacter(tick) {
        // Actualizar movimiento por waypoints si está caminando
        if (hero.waypoints.length > 0) {
          const target = hero.waypoints[0];
          const dx = target.x - hero.x;
          const dy = target.y - hero.y;
          const dist = Math.hypot(dx, dy);
          const speed = 3.8;
          if (dist <= speed) {
            hero.x = target.x;
            hero.y = target.y;
            hero.waypoints.shift();
          } else {
            hero.x += (dx / dist) * speed;
            hero.y += (dy / dist) * speed;
          }
        }

        const bob = Math.sin(tick * 0.15) * 2.5;
        const hx = Math.round(hero.x);
        const hy = Math.round(hero.y + bob);

        // Sombra bajo los pies del personaje
        drawPixelRect(hx - 10, Math.round(hero.y) + 12, 20, 5, 'rgba(0, 0, 0, 0.55)');

        if (heroImgLoaded) {
          ctx.save();
          if (hero.facing < 0) {
            ctx.translate(hx + 16, hy - 18);
            ctx.scale(-1, 1);
            ctx.drawImage(heroImg, 0, 0, 32, 32);
          } else {
            ctx.drawImage(heroImg, hx - 16, hy - 18, 32, 32);
          }
          ctx.restore();
        } else {
          // Sprite pixel-art procedural de respaldo
          drawPixelRect(hx - 6, hy - 14, 12, 10, '#ffccaa');
          drawPixelRect(hx - 7, hy - 16, 14, 4, '#451a03');
          drawPixelRect(hx - 7, hy - 4, 14, 10, '#00f0ff');
          drawPixelRect(hx - 6, hy + 6, 5, 6, '#1e3a8a');
          drawPixelRect(hx + 1, hy + 6, 5, 6, '#1e3a8a');
        }

        // Pequeño indicador '1P' sobre el personaje
        drawPixelRect(hx - 9, hy - 27, 18, 8, '#090d16');
        ctx.fillStyle = '#00ff66';
        ctx.font = '6px "Press Start 2P", monospace';
        ctx.fillText('1P', hx - 6, hy - 20);
      }

      function drawPixelPadlock(px, py, tick) {
        const bob = Math.round(Math.sin(tick * 0.08) * 2.5);
        const y = py + bob;

        // Aura oscura de fondo
        drawPixelRect(px - 10, y - 13, 20, 24, 'rgba(0, 0, 0, 0.55)');

        // Arco de metal plateado (shackle)
        drawPixelRect(px - 6, y - 12, 3, 7, '#94a3b8');
        drawPixelRect(px + 3, y - 12, 3, 7, '#94a3b8');
        drawPixelRect(px - 5, y - 14, 10, 3, '#f8fafc');

        // Cuerpo dorado del candado
        drawPixelRect(px - 8, y - 6, 16, 14, '#b45309');
        drawPixelRect(px - 7, y - 5, 14, 12, '#f59e0b');
        drawPixelRect(px - 6, y - 4, 12, 10, '#fde047');

        // Ojo de la cerradura negro
        drawPixelRect(px - 2, y - 1, 4, 4, '#0f172a');
        drawPixelRect(px - 1, y + 3, 2, 3, '#0f172a');
      }

      let tick = 0;
      function renderOverworld() {
        tick++;
        const W = canvas.width;
        const H = canvas.height;

        // 1. Cielo superior y Océano Pixel Art profundo
        const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
        skyGrad.addColorStop(0, '#0f172a');
        skyGrad.addColorStop(0.22, '#1d4ed8');
        skyGrad.addColorStop(0.23, '#0284c7');
        skyGrad.addColorStop(1, '#0369a1');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, H);

        // Sol / Luna pixelada en el horizonte
        drawPixelRect(500, 22, 26, 26, '#fde047');
        drawPixelRect(504, 18, 18, 34, '#fef08a');

        // 2. Olas animadas en el agua de fondo
        for (let wy = 105; wy < H - 40; wy += 24) {
          for (let wx = 18; wx < W - 18; wx += 48) {
            const offset = Math.sin(tick * 0.05 + wy * 0.1 + wx * 0.03) * 6;
            drawPixelRect(wx + offset, wy, 18, 3, 'rgba(125, 211, 252, 0.45)');
            drawPixelRect(wx + offset + 4, wy + 3, 10, 2, 'rgba(224, 242, 254, 0.35)');
          }
        }

        // 3. Nubes pixeladas flotando
        clouds.forEach((c) => {
          c.x += c.speed;
          if (c.x > W + 20) c.x = -c.w - 10;
          drawCloud(c.x, c.y, c.w, c.h);
        });

        // 4. Islas de los 4 Biomas (conectadas en perspectiva 2D)
        // Isla 1: Bosque y Ruinas (Abajo-Izquierda)
        drawIslandBase(122, 248, 82, 42, '#22c55e', '#15803d', '#92400e', 'rgba(186, 230, 253, 0.35)');
        // Isla 2: Cueva Cristalina (Arriba-Centro-Izquierda)
        drawIslandBase(262, 150, 74, 38, '#64748b', '#475569', '#334155', 'rgba(186, 230, 253, 0.35)');
        // Isla 3: Volcán de Fuego y Lava (Abajo-Centro-Derecha)
        drawIslandBase(403, 252, 76, 39, '#b45309', '#78350f', '#451a03', 'rgba(254, 202, 202, 0.28)');
        // Isla 4: Castillo Final Sentinel (Arriba-Derecha)
        drawIslandBase(531, 138, 78, 40, '#10b981', '#047857', '#334155', 'rgba(186, 230, 253, 0.35)');

        // Penumbra / velo sobre biomas bloqueados (LVL 03 y LVL 04)
        ctx.fillStyle = 'rgba(15, 23, 42, 0.32)';
        ctx.beginPath();
        ctx.ellipse(403, 252, 74, 38, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(531, 138, 76, 39, 0, 0, Math.PI * 2);
        ctx.fill();

        // 5. Camino de tierra y piedra que une secuencialmente las 4 islas
        drawStoneDirtPath();

        // Barrera / valla pixelada en el camino hacia las zonas bloqueadas
        drawPixelRect(327, 206, 16, 4, '#ef4444');
        drawPixelRect(329, 204, 12, 8, '#7f1d1d');
        drawPixelRect(333, 202, 4, 12, '#fca5a5');

        // 6. Decoración de cada Bioma (Árboles, Ruinas, Cueva, Volcán, Castillo)
        const treeSway = Math.round(Math.sin(tick * 0.04));
        drawPixelTree(68, 236, treeSway);
        drawPixelTree(92, 222, -treeSway);
        drawPixelTree(165, 254, treeSway);
        drawPixelRuins(142, 228);

        drawCaveBiome(262, 142, tick);
        drawLavaBiome(403, 244, tick);
        drawCastleBiome(531, 130, tick);
        drawPixelTree(478, 142, treeSway);
        drawPixelTree(582, 146, -treeSway);

        // Candados pixel art flotantes sobre las zonas bloqueadas (LVL 03 y LVL 04)
        drawPixelPadlock(403, 200, tick);
        drawPixelPadlock(531, 80, tick + 20);

        // 7. Personaje pixelado listo para avanzar y caminando entre niveles
        drawHeroCharacter(tick);

        requestAnimationFrame(renderOverworld);
      }

      renderOverworld();
    })();
  </script>
</body>
</html>
